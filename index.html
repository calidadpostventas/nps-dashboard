<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grupo GRP · NPS Postventa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Lora:ital,wght@1,500&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme: light dark;
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef1f5; --text:#16202b; --muted:#5d6b7a; --border:#dce2e9;
  --accent:#2457d6; --accent-bg:#e6edfc; --pos:#13875a; --pos-bg:#e1f3ea; --neu:#d99a12; --det:#d23c3c; --det-bg:#fbe6e6;
  --warn:#8a5a00; --warn-bg:#fff2d3; --zero:#8896a5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f141a; --surface:#171e26; --surface2:#1f2832; --text:#e8edf2; --muted:#9aa8b6; --border:#2b3643;
    --accent:#7aa2ff; --accent-bg:#1c2a4a; --pos:#3ccf91; --pos-bg:#12392b; --neu:#f0b429; --det:#ff6b6b; --det-bg:#3e1d1d;
    --warn:#f0c36a; --warn-bg:#3d3015; --zero:#6f7d8c;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f141a; --surface:#171e26; --surface2:#1f2832; --text:#e8edf2; --muted:#9aa8b6; --border:#2b3643;
  --accent:#7aa2ff; --accent-bg:#1c2a4a; --pos:#3ccf91; --pos-bg:#12392b; --neu:#f0b429; --det:#ff6b6b; --det-bg:#3e1d1d;
  --warn:#f0c36a; --warn-bg:#3d3015; --zero:#6f7d8c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.badge.ok{background:var(--pos-bg);color:var(--pos);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--det-bg);color:var(--det);border-color:transparent}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.card h2{font-size:15px;margin:0 0 12px}
.card h3{font-size:14px;margin:0 0 8px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:30px;font-weight:800;line-height:1.15;margin-top:4px}
.kpi .v.sm{font-size:19px;font-weight:700;line-height:1.3}
.kpi .d{font-size:12px;color:var(--muted);margin-top:4px}
.pos{color:var(--pos)} .neg{color:var(--det)} .zero{color:var(--zero)}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:16px}
.three{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
details.ms{position:relative}
details.ms summary{list-style:none;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 12px;display:flex;gap:8px;align-items:baseline;min-width:150px}
details.ms summary::-webkit-details-marker{display:none}
details.ms[open] summary{border-color:var(--accent)}
.mlabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.mval{font-weight:600;font-size:14px}
.mpanel{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:220px;max-height:280px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.mpanel label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.mpanel label:hover{background:var(--surface2)}
button.btn,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1220}}
:root[data-theme="dark"] .btn.primary{color:#0b1220}
.btn.danger{background:var(--det);border-color:var(--det);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)} .small{font-size:12px}
/* barras */
.brow{display:grid;grid-template-columns:minmax(110px,38%) 1fr 52px;gap:8px;align-items:center;padding:5px 0}
.blabel{font-size:13px;overflow:hidden;text-overflow:ellipsis}
.btrack{position:relative;height:16px;background:var(--surface2);border-radius:5px}
.bzero{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--zero);opacity:.7}
.bbar{position:absolute;top:2px;bottom:2px;border-radius:3px}
.bbar.p{background:var(--pos)} .bbar.n{background:var(--det)} .bbar.z{background:var(--zero);width:3px!important;left:calc(50% - 1px)!important}
.bbar.est{opacity:.55;background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.35) 4px 8px)}
.bval{text-align:right;font-weight:700;font-size:14px}
.bnone{grid-column:2 / span 2;font-size:12px;color:var(--muted);font-style:italic}
.srow{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:8px;align-items:center;padding:6px 0}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--surface2)}
.stack span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;min-width:0;overflow:hidden}
.stack .sp{background:var(--pos)} .stack .sn{background:var(--neu);color:#222} .stack .sd{background:var(--det)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.rank{display:grid;gap:4px}
.rank .it{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;background:var(--surface2);border-radius:8px;font-size:13px}
/* tabla */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface2);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.pend td{color:var(--muted);font-style:italic}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--pos-bg);color:var(--pos)} .pill.bad{background:var(--det-bg);color:var(--det)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
/* upload */
.drop{border:2px dashed var(--border);border-radius:14px;padding:26px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.icard{display:grid;grid-template-columns:150px 1fr;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px}
@media (max-width:640px){.icard{grid-template-columns:1fr}}
.thumb{width:100%;max-height:150px;object-fit:contain;background:var(--surface2);border-radius:8px;cursor:zoom-in}
.thumb.big{position:fixed;inset:5%;width:90%;height:90%;max-height:none;z-index:60;cursor:zoom-out;box-shadow:0 0 0 100vmax rgba(0,0,0,.7)}
.ihead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.f3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.f5{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
label.f{display:block;font-size:12px;color:var(--muted)}
label.f input,label.f select,.inp,.sel{display:block;width:100%;margin-top:3px;font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 9px}
.check{margin-top:10px;font-size:13px;display:grid;gap:4px}
.check .e{color:var(--det)} .check .w{color:var(--warn)} .check .i{color:var(--muted)} .check .o{color:var(--pos)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
/* config */
.cfgrow{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-bottom:8px}
@media (max-width:640px){.cfgrow{grid-template-columns:1fr}}
.add{display:flex;gap:8px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 10px;font-size:17px}
.mactions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mbox ul{margin:6px 0 10px 18px;padding:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;display:none}
#toast.err{background:var(--det);color:#fff}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px;margin-bottom:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
</style>
<style id="grp-brand">
/* Manual de marca Grupo GRP: NEGRO GRP #2D2926 · ORO GRP #866D4B · Montserrat / Hind / Lora italic */

  --warn:#7a5a1e; --warn-bg:#f3ead8; --zero:#8a8178;
}

    --accent:#b39565; --accent-bg:#3d3427; --pos:#5cc08f; --pos-bg:#1f3a2e; --neu:#c9b087; --det:#e07a70; --det-bg:#432724;

  --warn:#e3c487; --warn-bg:#3d3220; --zero:#8f867b;

body{font-family:Hind,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15.5px}
h1,.card h2,.card h3,nav.tabs button,.btn,.mlabel,.kpi .l,.kpi .v,.pill,th,.brandmark{font-family:Montserrat,system-ui,"Segoe UI",Helvetica,Arial,sans-serif}
header.top{background:#2D2926;color:#fff;border-radius:14px;border-top:4px solid #866D4B;padding:20px 24px;margin-bottom:16px;align-items:center}
.brandmark{font-weight:600;font-size:14px;color:#b39565;letter-spacing:0;margin-bottom:6px}
header.top h1{color:#fff;font-weight:700;font-size:26px;letter-spacing:-.3px}
header.top .sub{font-family:Lora,Georgia,"Times New Roman",serif;font-style:italic;color:#d8cdb9;font-size:15px;margin-top:4px}
header.top .sub em{color:#c9b087}
header.top .badge{background:rgba(255,255,255,.1);color:#e9e3d8;border-color:transparent}
header.top .badge.ok{background:rgba(92,192,143,.18);color:#8fdcb4}
header.top .badge.warn{background:rgba(227,196,135,.2);color:#e8cf9a}
nav.tabs{border-bottom-color:var(--border)}
nav.tabs button{font-weight:600;font-size:14px;letter-spacing:.1px}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.card{border-top:3px solid var(--accent);border-radius:12px}
.card h2{font-weight:700;letter-spacing:-.1px}
.kpi .l{font-weight:600;font-size:11px;letter-spacing:.8px;color:var(--accent)}
.kpi .v{font-weight:700}
.kpi .v.sm{font-weight:600}
.btn{font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
th{background:var(--surface2);color:var(--muted);font-weight:600}
.rank .it{background:var(--surface2)}
details.ms[open] summary{border-color:var(--accent)}
.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.stack .sn{color:#2D2926}
.banner{background:var(--warn-bg);color:var(--warn)}
</style>
<style id="board">
:root{--amb:#c58b0a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--amb:#e3b341}}
:root[data-theme="dark"]{--amb:#e3b341}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
.bc{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--c);border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.bh{display:flex;justify-content:space-between;align-items:center;font-family:Montserrat,system-ui,sans-serif;font-weight:700;letter-spacing:1.6px;font-size:13px;text-transform:uppercase}
.dot{width:13px;height:13px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.bvv{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:42px;line-height:1.1;margin:6px 0 10px;color:var(--c)}
.bvv small{font-size:12px;font-weight:700;color:var(--muted);margin-left:6px;letter-spacing:1px}
.bvv.sm{font-size:19px;font-weight:700;color:var(--muted);margin:10px 0}
.pb{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.pb span{display:block;height:100%}
.bfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:9px}
.bfoot b{color:var(--text)}
h2.ttl{font-size:15px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);margin:4px 0 14px}
table.bt th{text-align:center;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;background:transparent;border-bottom:2px solid var(--border);padding:12px 8px;position:static}
table.bt td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
table.bt td:last-child{border-right:0}
table.bt td.bl{text-align:left;font-family:Montserrat,system-ui,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.4px;font-size:14px}
table.bt tr.trow td{background:var(--surface2);border-top:2px solid var(--border);border-bottom:0}
table.bt td.tot{background:var(--surface2)}
.cv{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.2}
.cv.none{color:var(--zero);font-weight:600}
.cn{font-size:12px;color:var(--muted);margin-top:2px}
td.bx:hover{background:var(--accent-bg)}
</style>
<style id="v2">
:root{
  --bg:#E9E6E0; --surface:#F6F4EF; --surface2:#DDD8CF; --text:#2D2926; --muted:#6B645B; --border:#CDC7BB;
  --accent:#866D4B; --accent-bg:#E8DFD0; --pos:#2F8F63; --amb:#CF9B1D; --det:#BC473C; --zero:#8A8178;
  --pos-t:#1E6B47; --amb-t:#80590A; --det-t:#9A3329;
  --panel:#2D2926; --panel-text:#F4F0E8; --panel-muted:#B9B0A3; --zr:#D9614F; --za:#E2B33F; --zg:#4FB383;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1816; --surface:#24211F; --surface2:#34302C; --text:#F0ECE4; --muted:#A8A095; --border:#433E38;
    --accent:#C2A272; --accent-bg:#3A3126; --pos:#4FB383; --amb:#E2B33F; --det:#E0705F; --zero:#8F867B;
    --pos-t:#6FD1A0; --amb-t:#EBC35E; --det-t:#F08C7C; --panel:#2D2926;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1816; --surface:#24211F; --surface2:#34302C; --text:#F0ECE4; --muted:#A8A095; --border:#433E38;
  --accent:#C2A272; --accent-bg:#3A3126; --pos:#4FB383; --amb:#E2B33F; --det:#E0705F; --zero:#8F867B;
  --pos-t:#6FD1A0; --amb-t:#EBC35E; --det-t:#F08C7C; --panel:#2D2926;
}
body{font-family:Hind,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zg{--c:var(--pos);--t:var(--pos-t)} .za{--c:var(--amb);--t:var(--amb-t)} .zr{--c:var(--det);--t:var(--det-t)}
.wrap{padding-top:22px}
/* barra superior */
.topbar{background:var(--panel);color:var(--panel-text);border-bottom:3px solid #866D4B}
.tb-in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap}
.tb-brand{display:flex;align-items:baseline;gap:12px}
.mk{font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:18px;color:#fff}
.tb-title{font-family:Lora,Georgia,serif;font-style:italic;color:#C9B087;font-size:15px}
.topbar nav.tabs{display:flex;gap:4px;border:0;margin:0 auto 0 8px;padding:0;overflow-x:auto}
.topbar nav.tabs button{border:0;border-radius:99px;padding:8px 16px;color:#D3CABA;font-family:Montserrat,system-ui,sans-serif;font-weight:600;font-size:13.5px}
.topbar nav.tabs button.on{background:#F4F0E8;color:#2D2926;border:0}
.topbar .badge{background:rgba(255,255,255,.1);color:#E9E3D8;border-color:transparent}
.topbar .badge.ok{background:rgba(79,179,131,.2);color:#8FDCB4}
.topbar .badge.warn{background:rgba(226,179,63,.22);color:#EBCB83}
/* filtros */
.filters{gap:8px;margin-bottom:18px}
.flab{font-family:Lora,Georgia,serif;font-style:italic;color:var(--muted);margin-right:4px}
details.ms summary{border-radius:99px;padding:8px 16px;background:var(--surface)}
.mlabel{text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted)}
/* portada */
.hero{background:var(--panel);color:var(--panel-text);border-radius:22px;padding:30px;display:grid;grid-template-columns:minmax(280px,1fr) 1fr;gap:30px;align-items:center;margin-bottom:34px}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding:22px 18px}}
.gauge{max-width:440px;width:100%;margin:0 auto}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.needle{transform-box:view-box;transform-origin:200px 214px;transition:transform 1.7s cubic-bezier(.16,.84,.3,1)}
@media (prefers-reduced-motion: reduce){.needle{transition:none}}
.gauge-read{text-align:center;margin-top:8px}
.gauge-num{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:clamp(52px,10vw,76px);line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.gauge-cap{font-size:14px;color:var(--panel-muted);margin-top:4px}
.gauge-scale{text-align:center;font-size:12px;color:var(--panel-muted);opacity:.8;margin-top:2px}
.read h2{font-family:Lora,Georgia,serif;font-style:italic;font-weight:500;font-size:22px;letter-spacing:0;text-transform:none;color:#C9B087;margin:0 0 16px}
.read p{margin:0 0 14px;padding-left:14px;border-left:2px solid #866D4B;font-size:16.5px;line-height:1.55;color:#E6E0D3}
.read b{color:#fff;font-weight:600}
/* secciones */
.sec{margin-bottom:34px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px 20px;flex-wrap:wrap;margin-bottom:6px}
.sec h2{font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:21px;letter-spacing:-.2px;text-transform:none;color:var(--text);margin:0}
.sec-s{font-size:13px;color:var(--muted)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.key .k1{background:color-mix(in srgb,var(--det) 30%,var(--surface))}.key .k2{background:color-mix(in srgb,var(--amb) 30%,var(--surface))}.key .k3{background:color-mix(in srgb,var(--pos) 30%,var(--surface))}
.key .kg{width:3px;height:14px;border-radius:0;background:var(--accent);vertical-align:-3px}
/* filas con meta */
.br-list{border-top:1px solid var(--border);margin-top:10px}
.br{display:grid;grid-template-columns:170px 1fr 84px;gap:6px 18px;align-items:center;padding:16px 0 14px;border-bottom:1px solid var(--border)}
@media (max-width:640px){.br{grid-template-columns:1fr 84px}.br-track{grid-column:1 / -1;order:3}.br-mix{grid-column:1 / -1!important;order:4}}
.br-name{font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:17px}
.br-n{font-size:13px;color:var(--muted)}
.br-track{position:relative;height:20px}
.br-zones{position:absolute;inset:0;display:flex;border-radius:5px;overflow:hidden}
.br-zones i{display:block;height:100%}
.br-zones .z1{background:color-mix(in srgb,var(--det) 26%,var(--surface))}.br-zones .z2{background:color-mix(in srgb,var(--amb) 26%,var(--surface))}.br-zones .z3{background:color-mix(in srgb,var(--pos) 26%,var(--surface))}
.br-bar{position:absolute;left:0;top:5px;bottom:5px;background:var(--text);border-radius:0 3px 3px 0}
.br-goal{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--accent);border-radius:2px}
.br-val{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:28px;text-align:right;color:var(--t,var(--text));font-variant-numeric:tabular-nums}
.br-mix{grid-column:2 / 3;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.mixbar{flex:0 0 120px;height:6px;display:flex;border-radius:99px;overflow:hidden;background:var(--surface2)}
.mixbar i{display:block;height:100%}
/* matriz */
table.mx{border-collapse:separate;border-spacing:6px;width:100%;min-width:600px;margin:0 -6px}
table.mx th{font-family:Montserrat,system-ui,sans-serif;font-weight:600;font-size:13.5px;color:var(--muted);text-align:center;padding:4px;border:0;background:transparent;text-transform:none;letter-spacing:0;position:static}
table.mx td{border:0;white-space:normal}
td.mxl{font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:15.5px;text-align:left;padding:0 10px 0 6px}
td.mc{border-radius:12px;padding:14px 6px;text-align:center;background:color-mix(in srgb,var(--c) 15%,var(--surface))}
td.mc.tot{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent)}
td.mc.none{background:transparent;box-shadow:inset 0 0 0 1.5px var(--border);color:var(--muted)}
td.mc[data-act]{cursor:pointer}
td.mc[data-act]:hover{filter:brightness(.96)}
.cv{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:24px;line-height:1.15;color:var(--t,var(--muted));font-variant-numeric:tabular-nums}
.cn{font-size:12px;color:var(--muted);margin-top:2px}
/* resto de pestañas */
.card{border-top:1px solid var(--border);border-radius:16px;box-shadow:none}
.btn.primary{background:var(--panel);border-color:var(--panel);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1917}}
:root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1917}
</style>
<style id="gk">
:root{--gk-track:#DDD8CF;--gk-goal:#2D2926;--gk-sub:#6B645B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gk-track:#3E3934;--gk-goal:#F0ECE4;--gk-sub:#A8A095}}
:root[data-theme="dark"]{--gk-track:#3E3934;--gk-goal:#F0ECE4;--gk-sub:#A8A095}
.gk-group{margin-bottom:26px}
.gk-group h3{font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:17px;margin:20px 0 12px;color:var(--text)}
.gk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gk{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 14px 14px;text-align:center}
.gk[data-act]{cursor:pointer}
.gk[data-act]:hover{border-color:var(--c,var(--accent))}
.gk-h{display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:6px}
.gk-ic{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--panel);color:#C9B087;display:grid;place-items:center;font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:15px}
.gk-t{font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:15.5px;line-height:1.2}
.gk-s{font-size:12.5px;color:var(--muted)}
.gk svg{display:block;width:100%;height:auto;margin:0 auto}
.gk-prev{font-size:13px;color:var(--muted);margin-top:2px}
.gk-prev b{color:var(--text)}
.gk-prev .up{color:var(--pos-t);font-weight:700}.gk-prev .down{color:var(--det-t);font-weight:700}.gk-prev .eq{color:var(--amb-t);font-weight:700}
.gk-n{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:30px;margin-top:12px;font-variant-numeric:tabular-nums}
.gk-n small{font-family:Hind,system-ui,sans-serif;font-weight:500;font-size:13px;color:var(--muted)}
.gk-c{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px}
.gk-c div{display:flex;flex-direction:column;align-items:center;gap:2px}
.gk-c b{font-family:Montserrat,system-ui,sans-serif;font-size:18px;order:1}
.gk-c span{font-size:11.5px;color:var(--muted);order:2}
.gk-c svg{width:22px;height:22px;order:3;margin-top:2px}
.gk.none{border-style:dashed;text-align:left}
.gk-empty{margin:26px 0 14px;text-align:center;color:var(--muted);font-style:italic}
.gk.tot{background:var(--panel);color:var(--panel-text);border-color:var(--panel);--gk-track:rgba(255,255,255,.16);--gk-goal:#F4F0E8;--gk-sub:#B9B0A3}
.gk.tot .gk-s,.gk.tot .gk-prev,.gk.tot .gk-n small,.gk.tot .gk-c span{color:#B9B0A3}
.gk.tot .gk-prev b{color:#fff}
.gk.tot.zg{--t:var(--zg)}.gk.tot.za{--t:var(--za)}.gk.tot.zr{--t:var(--zr)}
.gk.tot .gk-ic{background:#866D4B;color:#fff}
</style>
<style id="login-css">
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--panel)}
.login[hidden]{display:none}
.lbox{width:100%;max-width:400px;background:var(--surface);border-radius:20px;border-top:4px solid #866D4B;padding:30px 26px;text-align:center}
.lbox .mk{color:var(--text);font-size:22px;display:block}
.lbox .tb-title{display:block;margin:4px 0 22px;color:var(--accent)}
.lbox input{display:block;width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);margin-bottom:12px}
.lbox button{width:100%;padding:12px}
.lmsg{min-height:22px;margin-top:10px;color:var(--det-t);font-size:14px}
.lnote{font-size:12.5px;color:var(--muted);margin-top:8px}
.btn.out{background:transparent;border-color:rgba(255,255,255,.25);color:#E9E3D8;padding:6px 12px;font-size:13px}
</style>

<body>
<div id="login" class="login"><form class="lbox" id="loginForm" autocomplete="off">
  <div class="mk">Grupo GRP</div><span class="tb-title">NPS de clientes · Postventa</span>
  <label for="pw" class="small muted" style="display:block;text-align:left;margin-bottom:4px">Contraseña</label>
  <input type="password" id="pw" autocomplete="current-password" required>
  <button class="btn primary" id="loginBtn" type="submit">Entrar</button>
  <div class="lmsg" id="loginMsg" role="alert"></div>
  <div class="lnote">Uso interno de Grupo GRP.</div>
</form></div>
<div id="app" hidden>
<div class="topbar"><div class="tb-in">
  <div class="tb-brand"><span class="mk">Grupo GRP</span><span class="tb-title">NPS de clientes · Postventa</span></div>
  <div style="margin-left:auto;display:flex;gap:10px;align-items:center"><div id="modeBadge"></div><button class="btn out" data-act="logout">Salir</button></div>
</div></div>
<div class="wrap"><main id="view"></main></div>
</div>
<script>
(function(){
'use strict';
/* Dashboard NPS Postventa · Grupo GRP — versión publicada (GitHub Pages).
   Los datos llegan cifrados (AES-GCM, clave derivada de la contraseña con PBKDF2-SHA256)
   en datos.enc.json y se descifran solo en el navegador. */

const cfg = {
  branches:[{id:'bahia-blanca',name:'Bahía Blanca'},{id:'tandil',name:'Tandil'},{id:'viedma',name:'Viedma'}],
  brands:[{id:'fiat',name:'Fiat'},{id:'peugeot',name:'Peugeot'},{id:'citroen',name:'Citroën'},{id:'trailcar',name:'Trailcar'}],
  combos:[
    ['bahia-blanca','fiat'],['bahia-blanca','peugeot'],['bahia-blanca','citroen'],['bahia-blanca','trailcar'],
    ['tandil','fiat'],
    ['viedma','fiat'],['viedma','peugeot'],['viedma','citroen'],['viedma','trailcar']
  ].map(([b,m])=>({branchId:b,brandId:m,active:true})),
  thresholds:{green:94,amber:88}
};
let records=[], meta={};
const ui={openMs:null,filters:{branch:new Set(),brand:new Set(),period:new Set(),status:new Set()}};

const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round1=v=>Math.round(v*10)/10;
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const branchName=id=>(cfg.branches.find(b=>b.id===id)||{}).name||id;
const brandName=id=>(cfg.brands.find(b=>b.id===id)||{}).name||id;
const idOf=(list,name)=>(list.find(x=>norm(x.name)===norm(name))||{}).id;

/* NPS = (promotores − detractores) / encuestas. Los totales suman conteos: ponderación exacta. */
const effNps=r=>r.n>0?round1((r.p-r.d)/r.n*100):null;
function aggBoard(recs){
  if(!recs.length) return {empty:true};
  if(new Set(recs.map(r=>r.period)).size>1) return {ok:false,reason:'Hay más de un período: elegí uno en el filtro.'};
  const n=recs.reduce((a,r)=>a+r.n,0),p=recs.reduce((a,r)=>a+r.p,0),u=recs.reduce((a,r)=>a+r.u,0),d=recs.reduce((a,r)=>a+r.d,0);
  if(!(n>0)) return {ok:false,reason:'No calculable: falta la cantidad de encuestas.'};
  return {ok:true,nps:round1((p-d)/n*100),n,p,u,d};
}
function periodsList(){return Array.from(new Set(records.map(r=>r.period))).sort().reverse();}
function getFiltered(){
  const f=ui.filters;
  const list=records.filter(r=>(!f.branch.size||f.branch.has(r.branchId))&&(!f.brand.size||f.brand.has(r.brandId))&&(!f.period.size||f.period.has(r.period)));
  const combos=cfg.combos.filter(c=>(!f.branch.size||f.branch.has(c.branchId))&&(!f.brand.size||f.brand.has(c.brandId)));
  return {list,hidden:0,combos};
}

function msHtml(key,label,options){
  const sel=ui.filters[key];
  const txt=sel.size===0?'Todas':(sel.size===1?((options.find(o=>o.v===Array.from(sel)[0])||{}).l||'1'):sel.size+' seleccionadas');
  return '<details class="ms" data-ms="'+key+'"'+(ui.openMs===key?' open':'')+'><summary><span class="mlabel">'+label+'</span><span class="mval">'+esc(txt)+'</span></summary><div class="mpanel">'
    +(options.map(o=>'<label><input type="checkbox" data-chg="msToggle" data-key="'+key+'" data-v="'+esc(o.v)+'"'+(sel.has(o.v)?' checked':'')+'> '+esc(o.l)+'</label>').join('')||'<div class="muted small" style="padding:6px">Sin opciones</div>')
    +'</div></details>';
}
const f1=v=>v==null?'—':(Math.round(v*10)/10).toFixed(1).replace('.',',');
const zoneCls=v=>{const t=cfg.thresholds;return v>=t.green?'zg':v>=t.amber?'za':'zr';};
function gaugeSvg(v,sMin,startDeg){
  const cx=200,cy=214,r=150,sw=20,t=cfg.thresholds;
  const f=x=>Math.max(0,Math.min(1,(x-sMin)/(100-sMin)));
  const P=(fr,rad)=>{const a=Math.PI*(1-fr);return [cx+rad*Math.cos(a),cy-rad*Math.sin(a)];};
  const arc=(a,b)=>{const p=P(a,r),q=P(b,r);return 'M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' A '+r+' '+r+' 0 0 1 '+q[0].toFixed(1)+' '+q[1].toFixed(1);};
  let s='<svg viewBox="-26 0 452 236" role="img" aria-label="Medidor del NPS del grupo: '+f1(v)+' sobre una meta de '+t.green+'">';
  [[0,f(t.amber),'var(--zr)'],[f(t.amber),f(t.green),'var(--za)'],[f(t.green),1,'var(--zg)']].forEach(z=>{
    if(z[1]>z[0]) s+='<path d="'+arc(z[0],z[1])+'" fill="none" style="stroke:'+z[2]+'" stroke-width="'+sw+'"/>';
  });
  for(let tv=Math.ceil(sMin/10)*10;tv<=100;tv+=10){
    const fr=f(tv),a=P(fr,r+sw/2+3),b=P(fr,r+sw/2+9),l=P(fr,r+sw/2+22);
    s+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="stroke:var(--panel-muted)" stroke-width="1.5"/>'
     +'<text x="'+l[0].toFixed(1)+'" y="'+(l[1]+4).toFixed(1)+'" text-anchor="middle" font-size="11" style="fill:var(--panel-muted)">'+tv+'</text>';
  }
  const g1=P(f(t.green),r-sw/2-7),g2=P(f(t.green),r+sw/2+7),gl=P(f(t.green),r+sw/2+38);
  s+='<line x1="'+g1[0].toFixed(1)+'" y1="'+g1[1].toFixed(1)+'" x2="'+g2[0].toFixed(1)+'" y2="'+g2[1].toFixed(1)+'" stroke="#C9B087" stroke-width="3.5"/>'
   +'<text x="'+gl[0].toFixed(1)+'" y="'+(gl[1]+4).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#C9B087">meta '+t.green+'</text>';
  const deg=f(v)*180;
  s+='<g class="needle" data-deg="'+deg.toFixed(1)+'" style="transform:rotate('+(startDeg==null?deg:startDeg).toFixed(1)+'deg)"><line x1="'+cx+'" y1="'+cy+'" x2="'+(cx-(r-sw/2-10))+'" y2="'+cy+'" style="stroke:var(--panel-text)" stroke-width="4" stroke-linecap="round"/></g>'
   +'<circle cx="'+cx+'" cy="'+cy+'" r="10" style="fill:var(--panel-text)"/><circle cx="'+cx+'" cy="'+cy+'" r="4" style="fill:var(--panel)"/></svg>';
  return s;
}
function insightsHtml(list,combos,tot,brandAgg,branchAgg){
  const t=cfg.thresholds,out=[];
  if(!tot.ok||tot.nps==null){
    out.push('Para consolidar el NPS del grupo faltan las cantidades de encuestas (n) de algunas mediciones.');
    return out;
  }
  const gap=round1(tot.nps-t.green);
  out.push('El NPS del grupo es <b>'+f1(tot.nps)+'</b>, sobre <b>'+(tot.n||'—')+'</b> encuestas. '+(gap>=0?'Supera la meta de '+t.green+' por <b>'+f1(gap)+'</b> puntos.':'Está a <b>'+f1(-gap)+'</b> puntos de la meta de '+t.green+'.'));
  if(brandAgg.length>=2){
    const s=brandAgg.slice().sort((a,b)=>b.nps-a.nps),top=s[0],low=s[s.length-1];
    out.push('<b>'+esc(top.name)+'</b> lidera entre las marcas con <b>'+f1(top.nps)+'</b>. '+(low.nps>=t.green?'Todas las marcas cumplen la meta.':'<b>'+esc(low.name)+'</b> es la que más se aleja de la meta: <b>'+f1(low.nps)+'</b>, a '+f1(t.green-low.nps)+' puntos.'));
  }
  if(branchAgg.length>=2){
    const s=branchAgg.slice().sort((a,b)=>a.nps-b.nps),low=s[0];
    out.push('<b>'+esc(low.name)+'</b> tiene el NPS más bajo entre las sucursales (<b>'+f1(low.nps)+'</b>)'+(low.n!=null&&low.n<30?', con solo <b>'+low.n+'</b> encuestas: un cambio mueve mucho el resultado.':'.'));
  }
  const withN=combos.filter(c=>c.n!=null);
  const few=withN.filter(c=>c.n<10).length;
  if(few>0) out.push('<b>'+few+'</b> de <b>'+withN.length+'</b> combinaciones tienen menos de 10 encuestas. Conviene leerlas como señal y no como tendencia.');
  return out;
}
function brandRow(b,recs,sMin){
  const a=aggBoard(recs),t=cfg.thresholds;
  const pos=x=>Math.max(0,Math.min(100,(x-sMin)/(100-sMin)*100));
  const name='<div><div class="br-name">'+esc(b.name)+'</div>';
  if(a.empty) return '<div class="br">'+name+'<div class="br-n">Sin datos</div></div></div>';
  if(!a.ok||a.nps==null) return '<div class="br">'+name+'<div class="br-n">No calculable</div></div><div class="br-mix" style="grid-column:2 / -1">'+esc(a.reason||'')+'</div></div>';
  const z=zoneCls(a.nps),p1=pos(t.amber),p2=pos(t.green);
  let mix='<span>Sin detalle de promotores y detractores</span>';
  if(a.p!=null){const N=a.p+a.u+a.d,w=x=>N?x/N*100:0;
    mix='<span class="mixbar"><i style="width:'+w(a.p)+'%;background:var(--pos)"></i><i style="width:'+w(a.u)+'%;background:var(--amb)"></i><i style="width:'+w(a.d)+'%;background:var(--det)"></i></span><span>'+a.p+' promotores, '+a.u+(a.u===1?' neutro, ':' neutros, ')+a.d+' detractores</span>';}
  return '<div class="br '+z+'">'+name+'<span class="br-n">'+(a.n!=null?a.n+' encuestas':'sin dato de encuestas')+'</span></div>'
   +'<div class="br-track"><div class="br-zones"><i class="z1" style="width:'+p1+'%"></i><i class="z2" style="width:'+(p2-p1)+'%"></i><i class="z3" style="width:'+(100-p2)+'%"></i></div>'
   +'<div class="br-bar" style="width:'+pos(a.nps)+'%"></div><div class="br-goal" style="left:calc('+p2+'% - 1.5px)"></div></div>'
   +'<div class="br-val">'+f1(a.nps)+'</div><div class="br-mix">'+mix+'</div></div>';
}
function boardCell(recs,tot){
  const a=aggBoard(recs);
  if(a.empty) return '<td class="mc none"><div class="cv">–</div><div class="cn">sin medición</div></td>';
  if(!a.ok||a.nps==null) return '<td class="mc none" title="'+esc(a.reason||'')+'"><div class="cv">N/C</div><div class="cn">falta n</div></td>';
  const click='';
  return '<td class="mc '+zoneCls(a.nps)+(tot?' tot':'')+'"'+click+'><div class="cv">'+f1(a.nps)+'</div><div class="cn">'+(a.n!=null?a.n+' encuestas':'sin n')+'</div></td>';
}
function faceSvg(kind){
  const col=kind==='d'?'var(--det)':kind==='n'?'var(--amb)':'var(--pos)';
  const mouth=kind==='d'?'<path d="M7.5 16.5 Q12 12.2 16.5 16.5" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>'
    :kind==='n'?'<path d="M8 15 L16 15" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>'
    :'<path d="M7.5 14 Q12 19 16.5 14" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="11" style="fill:'+col+'"/><circle cx="8.5" cy="9.5" r="1.3" fill="#000" fill-opacity=".55"/><circle cx="15.5" cy="9.5" r="1.3" fill="#000" fill-opacity=".55"/>'+mouth+'</svg>';
}
function miniGauge(v){
  const cx=110,cy=108,r=84,sw=15,t=cfg.thresholds;
  const P=(fr,rad)=>{const a=Math.PI*(1-fr);return [cx+rad*Math.cos(a),cy-rad*Math.sin(a)];};
  const arc=(a,b)=>{const p=P(a,r),q=P(b,r);return 'M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' A '+r+' '+r+' 0 0 1 '+q[0].toFixed(1)+' '+q[1].toFixed(1);};
  const f=Math.max(0,Math.min(0.9999,v/100)),g=Math.max(0,Math.min(1,t.green/100));
  const a=P(g,r-sw/2-4),b=P(g,r+sw/2+4);
  let s='<svg viewBox="0 0 220 132" role="img" aria-label="NPS '+f1(v)+' sobre una meta de '+t.green+'">'
   +'<path d="'+arc(0,1)+'" fill="none" style="stroke:var(--gk-track)" stroke-width="'+sw+'" stroke-linecap="round"/>';
  if(f>0.004) s+='<path d="'+arc(0,f)+'" fill="none" style="stroke:var(--c)" stroke-width="'+sw+'" stroke-linecap="round"/>';
  s+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="stroke:var(--gk-goal)" stroke-width="3"/>'
   +'<text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" style="fill:var(--t);font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:38px;font-variant-numeric:tabular-nums">'+f1(v)+'</text>'
   +'<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" style="fill:var(--gk-sub);font-size:12px">meta '+t.green+'</text>'
   +'<text x="'+(cx-r)+'" y="'+(cy+22)+'" text-anchor="middle" style="fill:var(--gk-sub);font-size:11px">0</text>'
   +'<text x="'+(cx+r)+'" y="'+(cy+22)+'" text-anchor="middle" style="fill:var(--gk-sub);font-size:11px">100</text></svg>';
  return s;
}
function prevNps(recs){
  if(recs.length!==1) return null;
  const r=recs[0];
  const pr=records.filter(x=>x.branchId===r.branchId&&x.brandId===r.brandId&&x.period<r.period).sort((a,b)=>a.period<b.period?1:-1)[0];
  return pr?effNps(pr):null;
}
function gaugeCard(title,sub,recs,isTot){
  const ini=esc(title.charAt(0).toUpperCase());
  const head='<div class="gk-h"><span class="gk-ic">'+(isTot?'Σ':ini)+'</span><div><div class="gk-t">'+esc(title)+'</div><div class="gk-s">'+esc(sub)+'</div></div></div>';
  const a=aggBoard(recs);
  if(a.empty) return '<div class="gk none">'+head+'<div class="gk-empty">Sin datos todavía</div></div>';
  if(!a.ok||a.nps==null) return '<div class="gk none">'+head+'<div class="gk-empty">No calculable</div><div class="gk-s" style="margin-top:6px">'+esc(a.reason||'')+'</div></div>';
  const z=zoneCls(a.nps),pv=prevNps(recs);
  let prev='';
  if(pv!=null){const d=round1(a.nps-pv),arrow=d>0?'↑':d<0?'↓':'—',cl=d>0?'up':d<0?'down':'eq';prev='<div class="gk-prev">Período anterior <b>'+f1(pv)+'</b> <span class="'+cl+'">'+arrow+'</span></div>';}
  const cnt=a.p!=null
    ?'<div class="gk-c"><div>'+faceSvg('d')+'<b>'+a.d+'</b><span>Detractores</span></div><div>'+faceSvg('n')+'<b>'+a.u+'</b><span>Neutrales</span></div><div>'+faceSvg('p')+'<b>'+a.p+'</b><span>Promotores</span></div></div>'
    :'<div class="gk-s" style="margin-top:12px">Sin detalle de promotores y detractores</div>';
  const click='';
  return '<div class="gk '+z+(isTot?' tot':'')+'"'+click+'>'+head+miniGauge(a.nps)+prev
    +'<div class="gk-n">'+(a.n!=null?a.n:'—')+' <small>encuestas</small></div>'+cnt+'</div>';
}
function boardCell(recs,tot){
  const a=aggBoard(recs);
  if(a.empty) return '<td class="mc none"><div class="cv">–</div><div class="cn">sin medición</div></td>';
  if(!a.ok||a.nps==null) return '<td class="mc none" title="'+esc(a.reason||'')+'"><div class="cv">N/C</div><div class="cn">falta n</div></td>';
  const click='';
  return '<td class="mc '+zoneCls(a.nps)+(tot?' tot':'')+'"'+click+'><div class="cv">'+f1(a.nps)+'</div><div class="cn">'+(a.n!=null?a.n+' encuestas':'sin n')+'</div></td>';
}
function renderDash(){
  if(!ui.autoP){ui.autoP=true;const ps=periodsList();if(ps.length>1&&!ui.filters.period.size)ui.filters.period.add(ps[0]);}
  const {list,hidden,combos}=getFiltered();
  const v=$('#view'),keepScroll=window.scrollY,t=cfg.thresholds;
  let h='<div class="filters"><span class="flab">Filtrar</span>'
    +msHtml('branch','Sucursal',cfg.branches.map(b=>({v:b.id,l:b.name})))
    +msHtml('brand','Marca',cfg.brands.map(b=>({v:b.id,l:b.name})))
    +msHtml('period','Período',periodsList().map(p=>({v:p,l:p})))
    +'<button class="btn ghost sm" data-act="clearFilters">Limpiar</button></div>';
  if(!records.length){
    h+='<div class="card empty"><b>Todavía no hay mediciones cargadas.</b><br>Subí los Excel al repositorio de datos.</div>';
    v.innerHTML=h;return;
  }
  const brands=cfg.brands.filter(b=>combos.some(c=>c.brandId===b.id));
  const branches=cfg.branches.filter(b=>combos.some(c=>c.branchId===b.id)).slice().sort((a,b)=>a.name.localeCompare(b.name,'es'));
  const tot=aggBoard(list);
  const brandAgg=[],branchAgg=[],comboAgg=[];
  brands.forEach(b=>{const a=aggBoard(list.filter(r=>r.brandId===b.id));if(a.ok&&a.nps!=null)brandAgg.push({name:b.name,nps:a.nps,n:a.n});});
  branches.forEach(b=>{const a=aggBoard(list.filter(r=>r.branchId===b.id));if(a.ok&&a.nps!=null)branchAgg.push({name:b.name,nps:a.nps,n:a.n});});
  combos.forEach(c=>{const a=aggBoard(list.filter(r=>r.branchId===c.branchId&&r.brandId===c.brandId));if(a.ok&&a.nps!=null)comboAgg.push({n:a.n});});
  const vals=brandAgg.map(x=>x.nps).concat(tot.ok&&tot.nps!=null?[tot.nps]:[]);
  const sMin=vals.length?Math.min(60,Math.floor(Math.min.apply(null,vals)/10)*10):60;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const animate=!ui.anim&&!reduce&&tot.ok&&tot.nps!=null;
  // portada: medidor del grupo + lectura
  h+='<section class="hero"><div class="gauge">';
  if(tot.ok&&tot.nps!=null){
    h+=gaugeSvg(tot.nps,sMin,animate?0:null)
      +'<div class="gauge-read"><div class="gauge-num" data-v="'+tot.nps+'">'+f1(tot.nps)+'</div><div class="gauge-cap">NPS del grupo'+(tot.n?', '+tot.n+' encuestas':'')+'</div></div>'
      +'<div class="gauge-scale">Escala de '+sMin+' a 100</div>';
  }else h+='<div class="gauge-read"><div class="gauge-num" style="font-size:34px">No calculable</div><div class="gauge-cap">'+esc(tot.reason||'Sin datos')+'</div></div>';
  h+='</div><div class="read"><h2>Lo que muestran los datos</h2>'+insightsHtml(list,comboAgg,tot,brandAgg,branchAgg).map(x=>'<p>'+x+'</p>').join('')+'</div></section>';
  // marcas frente a la meta
  h+='<section class="sec"><div class="sec-h"><h2>Marcas frente a la meta</h2><div class="key"><span><i class="k1"></i>Bajo '+t.amber+'</span><span><i class="k2"></i>'+t.amber+' a '+t.green+'</span><span><i class="k3"></i>'+t.green+' o más</span><span><i class="kg"></i>Meta</span></div></div><div class="br-list">'
    +brands.map(b=>brandRow(b,list.filter(r=>r.brandId===b.id),sMin)).join('')+'</div></section>';
  // sucursal por marca, con reloj
  h+='<section class="sec"><div class="sec-h"><h2>Sucursal por marca</h2><span class="sec-s">NPS total de cada sucursal y de cada marca dentro de ella</span></div>';
  branches.forEach(br=>{
    const bc=combos.filter(c=>c.branchId===br.id);
    const brBrands=brands.filter(b=>bc.some(c=>c.brandId===b.id));
    const brList=list.filter(r=>r.branchId===br.id);
    const withData=brBrands.filter(b=>brList.some(r=>r.brandId===b.id)).length;
    h+='<div class="gk-group"><h3>'+esc(br.name)+'</h3><div class="gk-grid">';
    if(withData>1) h+=gaugeCard('Total sucursal',br.name,brList,true);
    h+=brBrands.map(b=>gaugeCard(b.name,br.name,list.filter(r=>r.branchId===br.id&&r.brandId===b.id),false)).join('');
    h+='</div></div>';
  });
  h+='<p class="small muted" style="margin:6px 0 0">El reloj llena el arco hasta el NPS en una escala de 0 a 100 y la marca oscura indica la meta. Los totales ponderan cada NPS por su cantidad de encuestas, por lo que son exactos; si falta el n de alguna medición no se calculan.'+''+'</p></section>';
  v.innerHTML=h;
  window.scrollTo(0,keepScroll);
  if(animate){
    ui.anim=true;
    const nd=$('.needle',v),num=$('.gauge-num',v);
    if(nd){requestAnimationFrame(()=>requestAnimationFrame(()=>{nd.style.transform='rotate('+nd.dataset.deg+'deg)';}));}
    if(num){const target=+num.dataset.v,t0=performance.now(),from=sMin;
      const step=now=>{const k=Math.min(1,(now-t0)/1500),e=1-Math.pow(1-k,3);num.textContent=f1(from+(target-from)*e);if(k<1)requestAnimationFrame(step);else num.textContent=f1(target);};
      requestAnimationFrame(step);}
  }else if(!reduce)ui.anim=true;
}


function matrixHtml(list,combos){
  const brands=cfg.brands.filter(b=>combos.some(c=>c.brandId===b.id));
  const branches=cfg.branches.filter(b=>combos.some(c=>c.branchId===b.id));
  let h='<section class="sec"><div class="sec-h"><h2>Matriz sucursal × marca</h2><span class="sec-s">NPS y cantidad de encuestas</span></div><div style="overflow-x:auto"><table class="mx"><thead><tr><th></th>'
    +brands.map(b=>'<th>'+esc(b.name)+'</th>').join('')+'<th>Total sucursal</th></tr></thead><tbody>';
  branches.forEach(br=>{
    h+='<tr><td class="mxl">'+esc(br.name)+'</td>'+brands.map(b=>combos.some(c=>c.branchId===br.id&&c.brandId===b.id)
      ?boardCell(list.filter(r=>r.branchId===br.id&&r.brandId===b.id),false)
      :'<td class="mc none"><div class="cv">·</div><div class="cn">no mide</div></td>').join('')
      +boardCell(list.filter(r=>r.branchId===br.id),true)+'</tr>';
  });
  h+='<tr><td class="mxl">Total marca</td>'+brands.map(b=>boardCell(list.filter(r=>r.brandId===b.id),true)).join('')+boardCell(list,true)+'</tr>';
  return h+'</tbody></table></div></section>';
}
function render(){
  renderDash();
  const {list,combos}=getFiltered();
  const view=$('#view'),secs=$$('section.sec',view);
  if(secs.length) secs[secs.length-1].insertAdjacentHTML('beforebegin',matrixHtml(list,combos));
  const per=periodsList();
  const info=(meta.periodos||[]).filter(p=>!ui.filters.period.size||ui.filters.period.has(p.periodo));
  let foot='<p class="small muted" style="margin:18px 0 0">';
  info.forEach(p=>{
    const desc=Object.entries(p.descartadas||{}).map(([k,v])=>v+' ('+k+')').join(', ');
    foot+='Período '+esc(p.periodo)+': encuestas del '+esc(p.desde)+' al '+esc(p.hasta)+'.'+(desc?' Quedaron fuera del cálculo: '+esc(desc)+'.':'')+' ';
  });
  foot+='Datos actualizados el '+esc(meta.generadoTexto||'—')+'</p>';
  view.insertAdjacentHTML('beforeend',foot);
  $('#modeBadge').innerHTML=per.length?'<span class="badge ok">Período '+esc(ui.filters.period.size?Array.from(ui.filters.period).join(', '):per[0])+'</span>':'';
}

/* ───── Eventos de filtros ───── */
document.addEventListener('click',e=>{
  if(!e.target.closest('details.ms')){const o=$$('details.ms[open]');if(o.length){o.forEach(d=>d.open=false);ui.openMs=null;}}
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='clearFilters'){Object.values(ui.filters).forEach(s=>s.clear());const ps=periodsList();if(ps.length)ui.filters.period.add(ps[0]);ui.openMs=null;render();}
  if(t.dataset.act==='logout'){try{sessionStorage.removeItem('nps_pw');}catch(e){}location.reload();}
});
document.addEventListener('toggle',e=>{
  const d=e.target;if(!d||!d.dataset||!d.dataset.ms)return;
  if(d.open){ui.openMs=d.dataset.ms;$$('details.ms[open]').forEach(o=>{if(o!==d)o.open=false;});}
  else if(ui.openMs===d.dataset.ms)ui.openMs=null;
},true);
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset&&t.dataset.chg==='msToggle'){const s=ui.filters[t.dataset.key];if(t.checked)s.add(t.dataset.v);else s.delete(t.dataset.v);render();}
});

/* ───── Descifrado ───── */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pkg,password){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(pkg.salt),iterations:pkg.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(pkg.iv)},key,b64(pkg.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function load(data){
  meta=data;
  const g=new Date(data.generado);
  meta.generadoTexto=isNaN(g)?data.generado:g.toLocaleString('es-AR',{dateStyle:'long',timeStyle:'short'});
  records=[];
  (data.periodos||[]).forEach(p=>p.filas.forEach(f=>{
    const b=idOf(cfg.branches,f.sucursal),m=idOf(cfg.brands,f.marca);
    if(b&&m) records.push({id:b+'__'+m+'__'+p.periodo,branchId:b,brandId:m,period:p.periodo,n:f.encuestas,p:f.promotores,u:f.neutros,d:f.detractores});
  }));
  const ps=periodsList();if(ps.length)ui.filters.period.add(ps[0]);
}
let pkgCache=null;
async function tryLogin(pw){
  if(!pkgCache){
    const r=await fetch('datos.enc.json',{cache:'no-store'});
    if(!r.ok) throw new Error('nodata');
    pkgCache=await r.json();
  }
  const data=await decrypt(pkgCache,pw);
  load(data);
  $('#login').hidden=true;$('#app').hidden=false;
  render();
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=$('#pw').value,btn=$('#loginBtn'),msg=$('#loginMsg');
  if(!pw)return;
  btn.disabled=true;btn.textContent='Abriendo…';msg.textContent='';
  try{
    await tryLogin(pw);
    try{sessionStorage.setItem('nps_pw',pw);}catch(e){}
  }catch(err){
    msg.textContent=err.message==='nodata'?'Todavía no hay datos publicados. Probá en unos minutos.':'Contraseña incorrecta.';
    btn.disabled=false;btn.textContent='Entrar';$('#pw').select();
  }
});
(async()=>{let pw=null;try{pw=sessionStorage.getItem('nps_pw');}catch(e){}
  if(pw){try{await tryLogin(pw);}catch(e){try{sessionStorage.removeItem('nps_pw');}catch(_){}}}
  if($('#app').hidden)$('#pw').focus();
})();
})();

</script>
